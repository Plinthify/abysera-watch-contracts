# Deploy workflow for Abysera services/packages.
# Derives deployment parameters from the repository name and deploys to the dev
# services host via AWS SSM using GitHub OIDC.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy to dev (branch, tag, or SHA)
        required: true
        default: main
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Determine deployment parameters
        id: params
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DEPLOY_REF="${{ github.event.inputs.ref }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            DEPLOY_REF="${{ github.event.release.tag_name }}"
          else
            DEPLOY_REF="${{ github.ref_name }}"
          fi

          if [[ ! "$DEPLOY_REF" =~ ^[A-Za-z0-9._/@-]+$ ]] || [[ "$DEPLOY_REF" == -* ]]; then
            echo "Invalid deploy ref: $DEPLOY_REF" >&2
            exit 1
          fi

          REPO_NAME="${{ github.event.repository.name }}"
          SERVICE_NAME="$REPO_NAME"
          SERVICE_PATH="${REPO_NAME#abysera-}"
          PM2_NAME="$SERVICE_PATH"

          case "$SERVICE_PATH" in
            trade-sauce)  PORT=8092 ;;
            hall-monitor) PORT=8091 ;;
            omnibus)      PORT=8080 ;;
            *)            PORT=8080 ;;
          esac

          echo "environment=dev" >> "$GITHUB_OUTPUT"
          echo "ref=$DEPLOY_REF" >> "$GITHUB_OUTPUT"
          echo "service_name=$SERVICE_NAME" >> "$GITHUB_OUTPUT"
          echo "service_path=$SERVICE_PATH" >> "$GITHUB_OUTPUT"
          echo "pm2_name=$PM2_NAME" >> "$GITHUB_OUTPUT"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::497077511223:role/abysera-dev-github-deploy-role
          aws-region: us-east-1

      - name: Deploy via SSM
        shell: bash
        run: |
          set -euo pipefail
          echo "Deploying ${{ steps.params.outputs.service_name }}@${{ steps.params.outputs.ref }} to dev"

          INSTANCE_ID=$(aws ssm get-parameter \
            --name "/abysera/dev/services-host-instance-id" \
            --query "Parameter.Value" \
            --output text)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ steps.params.outputs.service_name }} ${{ steps.params.outputs.ref }}" \
            --parameters commands='[
              "set -eu",
              "export HOME=/home/ubuntu PM2_HOME=/home/ubuntu/.pm2",
              "APP_ROOT=/home/ubuntu/abysera/services/${{ steps.params.outputs.service_path }}",
              "REPO_URL=https://github.com/${{ github.repository }}.git",
              "if [ ! -d \"$APP_ROOT/.git\" ]; then mkdir -p \"$(dirname \"$APP_ROOT\")\"; git clone \"$REPO_URL\" \"$APP_ROOT\"; fi",
              "cd \"$APP_ROOT\"",
              "git fetch --tags origin",
              "git checkout --force -- \"${{ steps.params.outputs.ref }}\"",
              "if [ -f package-lock.json ]; then npm ci; else npm install; fi",
              "npm run build --if-present",
              "if command -v pm2 >/dev/null 2>&1 && pm2 describe ${{ steps.params.outputs.pm2_name }} >/dev/null 2>&1; then pm2 restart ${{ steps.params.outputs.pm2_name }} --update-env; elif command -v pm2 >/dev/null 2>&1 && [ -f ecosystem.config.js ]; then pm2 start ecosystem.config.js --only ${{ steps.params.outputs.pm2_name }}; else echo \"No PM2 process or ecosystem config for ${{ steps.params.outputs.pm2_name }}; deploy completed without process restart.\"; fi"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"
          deadline=$((SECONDS + 900))
          status="Pending"

          while [ "$SECONDS" -lt "$deadline" ]; do
            status=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            case "$status" in
              Success|Cancelled|TimedOut|Failed|Cancelling)
                break
                ;;
            esac

            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}"

          if [ "$status" != "Success" ]; then
            echo "Deploy command finished with status: $status" >&2
            exit 1
          fi

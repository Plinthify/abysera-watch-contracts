name: Deploy watch-contracts

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      ref:
        description: 'Git ref to deploy (branch, tag, or SHA)'
        required: true
        default: 'main'

  release:
    types: [published]

  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment || (github.ref_type == 'tag' && 'prod') || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || (github.ref_type == 'tag' && 'prod') || 'dev' }}
    steps:
      - name: Determine deployment parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            echo "ref=${{ github.event.inputs.ref }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "release" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "ref=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "environment=prod" >> $GITHUB_OUTPUT
              echo "ref=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            else
              echo "environment=dev" >> $GITHUB_OUTPUT
              echo "ref=${{ github.sha }}" >> $GITHUB_OUTPUT
            fi
          fi

          echo "service_name=abysera-watch-contracts" >> $GITHUB_OUTPUT
          echo "service_path=watch-contracts" >> $GITHUB_OUTPUT
          echo "pm2_name=watch-contracts" >> $GITHUB_OUTPUT
          echo "port=8080" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.params.outputs.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::497077511223:role/abysera-${{ steps.params.outputs.environment }}-github-deploy-role
          aws-region: us-east-1

      - name: Deploy via SSM
        run: |
          echo "Deploying abysera-watch-contracts to ${ steps.params.outputs.environment }..."

          INSTANCE_ID=$(aws ssm get-parameter \
            --name "/abysera/${{ steps.params.outputs.environment }}/services-host-instance-id" \
            --query "Parameter.Value" \
            --output text)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy abysera-watch-contracts" \
            --parameters "commands=[
              \"cd /home/ubuntu/abysera/services/watch-contracts\",
              \"git fetch origin\",
              \"git checkout ${{ steps.params.outputs.ref }}\",
              \"git pull origin ${{ steps.params.outputs.ref }}\",
              \"npm install\",
              \"npm run build 2>/dev/null || true\",
              \"HOME=/home/ubuntu PM2_HOME=/home/ubuntu/.pm2 pm2 restart watch-contracts || HOME=/home/ubuntu PM2_HOME=/home/ubuntu/.pm2 pm2 start ecosystem.config.js --only watch-contracts\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}"
